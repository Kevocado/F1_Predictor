name: Deploy to Azure Container Apps
on:
  # Everything runs on the VPS now: this Azure deploy no longer fires on push
  # or PR. Run it by hand from the Actions tab only if Azure is ever needed.
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Build and push image
        run: |
          docker build -t ghcr.io/kevocado/f1-predictor:${{ github.sha }} -t ghcr.io/kevocado/f1-predictor:latest .
          docker push ghcr.io/kevocado/f1-predictor:${{ github.sha }}
          docker push ghcr.io/kevocado/f1-predictor:latest
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy new image
        run: |
          az containerapp update --name f1-predictor --resource-group predictor-hub-rg --image ghcr.io/kevocado/f1-predictor:${{ github.sha }}
