name: Refresh public snapshot

# Runs public_snapshot.py on GitHub's own infrastructure and pushes
# data/public_snapshot.json + data/tracking.db if either changed. The
# deploy workflow ignores the snapshot path (see deploy-azure.yml's
# paths-ignore) -- the running container instead picks up the new
# public_snapshot.json within PUBLIC_SNAPSHOT_POLL_SECONDS by polling this
# file's raw GitHub URL (see api/routes.py::refresh_public_snapshot_from_remote),
# no redeploy needed. tracking.db has no equivalent live-poll path (it's a
# SQLite file, not a small JSON blob to fetch-and-swap) -- an updated
# tracking.db only reaches the running deployment on its next deploy, an
# accepted lag, not a bug. public_snapshot.py itself does the actual
# snapshot-then-reconcile work against tracking.db on every run of this
# workflow (see its module docstring) -- this step only commits the result.

# Two cadences (cron is always UTC; GitHub may delay a scheduled run by
# several minutes under load and may drop one entirely, so nothing here
# depends on an exact firing time):
#
#   1. "40 */6 * * *"  -- the original baseline. ALWAYS does a full build,
#      so a missed/late result is never more than ~6h stale, and a gate
#      failure can never cost correctness.
#   2. Race-weekend cron -- every 20 minutes from Fri 08:00 through Sun
#      23:59 UTC. Qualifying, sprint and race are the sessions that change
#      predictions (grid / quali_position); the latest one of any round
#      finishes before Sun ~23:00 UTC, and Fri-before-08:00 sessions are
#      practice only (not a model input). These runs are GATED:
#      weekend_gate.py asks Jolpica whether a qualifying/sprint/race result
#      exists that the last successful build has not handled. If not, the
#      run stops after a few cheap requests -- no rebuild, no commit.
#
# Rate-limit rationale: Jolpica's unauthenticated limit is ~4 req/s burst,
# 500 req/h. A gate-only run is <= 3 requests per round in the weekend
# window (one round), ~9 req/h at 3 ticks/h. The expensive full build runs
# once per newly landed result, not per tick. 20 minutes (not 5) keeps
# Actions minutes low: a no-op tick is dominated by runner setup.
on:
  schedule:
    - cron: "40 */6 * * *"
    - cron: "*/20 8-23 * * 5"
    - cron: "*/20 * * * 6"
    - cron: "*/20 * * * 0"
  workflow_dispatch: {}

# Two overlapping runs once corrupted the snapshot (see push step). Queue,
# don't cancel: a cancelled build would skip recording its results.
concurrency:
  group: refresh-public-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      # data/cache/ (jolpica/fastf1/openf1/open_meteo, all gitignored) is
      # what makes repeated runs fast and stays within jolpica's
      # unauthenticated rate limit. A fresh checkout starts with none of
      # it except the immutable past-season jolpica cache baked into the
      # repo itself.
      # restore + conditional save (instead of actions/cache) so a no-op
      # weekend tick does not write a new cache entry every 20 minutes.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-

      # Only the weekend crons are gated; the 6-hourly cron and manual
      # dispatch always build (a failed gate there is ignored).
      - name: Gate (new session result?)
        id: gate
        env:
          IS_WEEKEND_TICK: ${{ github.event_name == 'schedule' && github.event.schedule != '40 */6 * * *' }}
        run: |
          if [ "$IS_WEEKEND_TICK" = "true" ]; then
            python -m f1_predictor.weekend_gate check
          else
            python -m f1_predictor.weekend_gate check || true
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build snapshot
        if: steps.gate.outputs.refresh == 'true'
        run: |
          python -m f1_predictor.public_snapshot
          python -m f1_predictor.weekend_gate record

      - name: Save data cache
        if: steps.gate.outputs.refresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}

      - name: Commit and push if changed
        if: steps.gate.outputs.refresh == 'true'
        # Confirmed directly (not theoretical): an overlapping run once
        # produced a real git merge conflict in public_snapshot.json that
        # got committed with literal <<<<<<< markers still in it, breaking
        # the site's JSON poll until manually fixed. Two defenses against a
        # repeat: (1) validate the file actually parses as JSON before
        # committing -- fail loud here rather than ship broken content;
        # (2) pull --rebase immediately before committing, and retry once
        # (pull --rebase, recommit) if the push is rejected as non-fast-
        # forward, to absorb a genuinely concurrent run instead of racing it.
        run: |
          set -e
          python -c "import json; json.load(open('data/public_snapshot.json'))"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/public_snapshot.json
          git add -f data/tracking.db
          if [ -f data/session_results_seen.json ]; then git add data/session_results_seen.json; fi
          if git diff --cached --quiet; then
            echo "No change, nothing to push."
            exit 0
          fi
          git commit -m "Refresh public snapshot + track record [automated]"

          for attempt in 1 2; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- pulling and retrying..."
            git pull --rebase
          done
          echo "Push failed after retry." >&2
          exit 1
