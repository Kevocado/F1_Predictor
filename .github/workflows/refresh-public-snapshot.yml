name: Refresh public snapshot

# Runs public_snapshot.py on GitHub's own infrastructure and pushes
# data/public_snapshot.json if it changed. The deploy workflow ignores
# this path (see deploy-azure.yml's paths-ignore) -- the running
# container instead picks the new snapshot up within
# PUBLIC_SNAPSHOT_POLL_SECONDS by polling this file's raw GitHub URL (see
# api/routes.py::refresh_public_snapshot_from_remote), no redeploy needed.

on:
  schedule:
    # F1 race weekends are ~2 weeks apart; every 6 hours on any day covers
    # a session result landing without needing a race-calendar-aware cron.
    - cron: "40 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      # data/cache/ (jolpica/fastf1/openf1/open_meteo, all gitignored) is
      # what makes repeated runs fast and stays within jolpica's
      # unauthenticated rate limit. A fresh checkout starts with none of
      # it except the immutable past-season jolpica cache baked into the
      # repo itself.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-

      - name: Build snapshot
        run: python -m f1_predictor.public_snapshot

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/public_snapshot.json; then
            echo "No change, nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/public_snapshot.json
          git commit -m "Refresh public snapshot [automated]"
          git push
