[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1_predictor"
version = "0.1.0"
description = "Formula 1 race outcome, championship projection, and live in-race predictor"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "xgboost",
    "scikit-learn",
    "requests",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "fastf1",
    "optuna",
]

[project.optional-dependencies]
dev = ["jupyter", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]
